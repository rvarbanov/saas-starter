services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    # `.env` is tracked (may be comment-only). `.env.local` / `.secret` are created locally;
    # optional so Compose still starts for CI `docker compose run … pnpm test` without them.
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: .secret
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["pnpm", "dev:native", "--hostname", "0.0.0.0", "--port", "3000"]

volumes:
  node_modules:
