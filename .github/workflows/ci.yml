name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests (Vitest)
        run: pnpm test

  docker-integration:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Integration tests in Compose
        run: docker compose run --rm app pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    # Browsers + OS deps are pre-installed; skip `playwright install --with-deps` (slow apt on every run).
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # RAD-184: PR e2e deploys to saas-starter-ci only. Never reference
      # secrets.CONVEX_DEPLOY_KEY on pull_request (live incredible-dalmatian-315).
      - name: Deploy Convex functions (PR → CI)
        if: github.event_name == 'pull_request'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_CI }}
          NEXT_PUBLIC_CONVEX_URL_CI: ${{ vars.NEXT_PUBLIC_CONVEX_URL_CI }}
        run: |
          if [ -z "${CONVEX_DEPLOY_KEY}" ]; then
            echo "CONVEX_DEPLOY_KEY_CI unset — refusing PR Convex deploy." >&2
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_CONVEX_URL_CI}" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL_CI unset — refusing PR Convex deploy." >&2
            exit 1
          fi
          key_target="${CONVEX_DEPLOY_KEY%%|*}"
          if [ "${key_target}" = "prod:incredible-dalmatian-315" ]; then
            echo "Refusing PR deploy: CONVEX_DEPLOY_KEY_CI targets live production (${key_target})." >&2
            exit 1
          fi
          echo "Deploying Convex for PR e2e to ${key_target} (URL host: ${NEXT_PUBLIC_CONVEX_URL_CI#https://})"
          pnpm exec convex deploy --yes
          pnpm convex:backfill-search-text

      - name: Deploy Convex functions (main → production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "${CONVEX_DEPLOY_KEY}" ]; then
            echo "CONVEX_DEPLOY_KEY unset — refusing production Convex deploy." >&2
            exit 1
          fi
          key_target="${CONVEX_DEPLOY_KEY%%|*}"
          echo "Deploying Convex for main to ${key_target}"
          pnpm exec convex deploy --yes
          pnpm convex:backfill-search-text

      # Job env inherits this so Playwright/Next see CI Convex instead of committed .env prod URL.
      - name: Point PR e2e at CI Convex URL
        if: github.event_name == 'pull_request'
        env:
          NEXT_PUBLIC_CONVEX_URL_CI: ${{ vars.NEXT_PUBLIC_CONVEX_URL_CI }}
        run: |
          if [ -z "${NEXT_PUBLIC_CONVEX_URL_CI}" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL_CI unset — refusing e2e." >&2
            exit 1
          fi
          echo "NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL_CI}" >> "$GITHUB_ENV"
          echo "E2E NEXT_PUBLIC_CONVEX_URL host: ${NEXT_PUBLIC_CONVEX_URL_CI#https://}"

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # WORKOS_CLIENT_ID comes from committed `.env` (do not override with a placeholder).
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/callback
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # Real AuthKit key + e2e user (repo Actions secrets). Cookie password may be CI-only.
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_COOKIE_PASSWORD: "01234567890123456789012345678901"
          E2E_WORKOS_EMAIL: ${{ secrets.E2E_WORKOS_EMAIL }}
          E2E_WORKOS_PASSWORD: ${{ secrets.E2E_WORKOS_PASSWORD }}
          # Role personas. Empty secrets skip Z–AG; they do not fail the job.
          E2E_SYS_ADM_EMAIL: ${{ secrets.E2E_SYS_ADM_EMAIL }}
          E2E_SYS_ADM_PASSWORD: ${{ secrets.E2E_SYS_ADM_PASSWORD }}
          E2E_USR_ADM_EMAIL: ${{ secrets.E2E_USR_ADM_EMAIL }}
          E2E_USR_ADM_PASSWORD: ${{ secrets.E2E_USR_ADM_PASSWORD }}
          E2E_USR_MGR_EMAIL: ${{ secrets.E2E_USR_MGR_EMAIL }}
          E2E_USR_MGR_PASSWORD: ${{ secrets.E2E_USR_MGR_PASSWORD }}
          E2E_USR_VWR_EMAIL: ${{ secrets.E2E_USR_VWR_EMAIL }}
          E2E_USR_VWR_PASSWORD: ${{ secrets.E2E_USR_VWR_PASSWORD }}
          E2E_SYS_ADM_TARGET_EMAIL: ${{ secrets.E2E_SYS_ADM_TARGET_EMAIL }}
          E2E_SYS_ADM_TARGET_PASSWORD: ${{ secrets.E2E_SYS_ADM_TARGET_PASSWORD }}
          E2E_NO_ROLE_EMAIL: ${{ secrets.E2E_NO_ROLE_EMAIL }}
          E2E_NO_ROLE_PASSWORD: ${{ secrets.E2E_NO_ROLE_PASSWORD }}
