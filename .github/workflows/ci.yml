name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests (Vitest)
        run: pnpm test

  docker-integration:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Integration tests in Compose
        run: docker compose run --rm app pnpm test

  # E2e uses Environment `ci` on PR and main. Do not reference Environment `prod`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    environment: ci
    # Browsers + OS deps are pre-installed; skip `playwright install --with-deps` (slow apt on every run).
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Environment `ci` supplies CONVEX_DEPLOY_KEY + NEXT_PUBLIC_CONVEX_URL.
      # Do not echo deploy keys.
      - name: Deploy Convex functions (CI)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          . scripts/ci-require-env.sh
          require_env "CONVEX_DEPLOY_KEY" "${CONVEX_DEPLOY_KEY}"
          require_env "NEXT_PUBLIC_CONVEX_URL" "${NEXT_PUBLIC_CONVEX_URL}"
          echo "Deploying Convex for e2e (URL host: ${NEXT_PUBLIC_CONVEX_URL#https://})"
          pnpm exec convex deploy --yes
          pnpm convex:backfill-search-text

      # Job env inherits this so Playwright/Next see CI Convex instead of committed .env prod URL.
      - name: Point e2e at CI Convex URL
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          . scripts/ci-require-env.sh
          require_env "NEXT_PUBLIC_CONVEX_URL" "${NEXT_PUBLIC_CONVEX_URL}"
          echo "NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}" >> "$GITHUB_ENV"
          echo "E2E NEXT_PUBLIC_CONVEX_URL host: ${NEXT_PUBLIC_CONVEX_URL#https://}"

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # WORKOS_CLIENT_ID comes from committed `.env` (do not override with a placeholder).
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/callback
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # Real AuthKit key + e2e user (repo Actions secrets). Cookie password may be CI-only.
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_COOKIE_PASSWORD: "01234567890123456789012345678901"
          E2E_WORKOS_EMAIL: ${{ secrets.E2E_WORKOS_EMAIL }}
          E2E_WORKOS_PASSWORD: ${{ secrets.E2E_WORKOS_PASSWORD }}
          # Role personas. Empty secrets skip Z–AG; they do not fail the job.
          E2E_SYS_ADM_EMAIL: ${{ secrets.E2E_SYS_ADM_EMAIL }}
          E2E_SYS_ADM_PASSWORD: ${{ secrets.E2E_SYS_ADM_PASSWORD }}
          E2E_USR_ADM_EMAIL: ${{ secrets.E2E_USR_ADM_EMAIL }}
          E2E_USR_ADM_PASSWORD: ${{ secrets.E2E_USR_ADM_PASSWORD }}
          E2E_USR_MGR_EMAIL: ${{ secrets.E2E_USR_MGR_EMAIL }}
          E2E_USR_MGR_PASSWORD: ${{ secrets.E2E_USR_MGR_PASSWORD }}
          E2E_USR_VWR_EMAIL: ${{ secrets.E2E_USR_VWR_EMAIL }}
          E2E_USR_VWR_PASSWORD: ${{ secrets.E2E_USR_VWR_PASSWORD }}
          E2E_SYS_ADM_TARGET_EMAIL: ${{ secrets.E2E_SYS_ADM_TARGET_EMAIL }}
          E2E_SYS_ADM_TARGET_PASSWORD: ${{ secrets.E2E_SYS_ADM_TARGET_PASSWORD }}
          E2E_NO_ROLE_EMAIL: ${{ secrets.E2E_NO_ROLE_EMAIL }}
          E2E_NO_ROLE_PASSWORD: ${{ secrets.E2E_NO_ROLE_PASSWORD }}

  # Deploys Convex via Environment `prod` after gates pass (main only).
  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [quality, docker-integration, e2e]
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Convex functions (prod)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          . scripts/ci-require-env.sh
          require_env "CONVEX_DEPLOY_KEY" "${CONVEX_DEPLOY_KEY}"
          echo "Deploying Convex for prod"
          pnpm exec convex deploy --yes
          pnpm convex:backfill-search-text
